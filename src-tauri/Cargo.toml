[package]
name = "calculuser"
version = "0.1.0"
description = "Calculuser - 基于 λ 演算与渐进类型理论的工坊建造与逻辑推演解谜游戏"
authors = ["Arimura Romi <biyuehuya@gmail.com>"]
homepage = "https://github.com/biyuehu/calculuser"
repository = "https://github.com/biyuehu/calculuser"
license = "GPL-3.0"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
