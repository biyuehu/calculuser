name: CI & Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Deploy
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome format & lint check
        run: bun run lint

      - name: TypeScript type check
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Build Web distribution
        run: bun run build

      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist
      #     publish_branch: webapge
      #     cname: calculuser.vercel.app

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-web
          path: dist/

      - name: Build Tauri bundles and binaries
        run: bun run tauri:build

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-windows-portable
          path: src-tauri/target/release/calculuser.exe

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
