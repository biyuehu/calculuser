name: CI & Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-and-web:
    name: Lint, Test, Web Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome format & lint check
        run: bun run lint

      - name: TypeScript type check
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Build Web distribution
        run: bun run build

      - name: Setup CNAME
        run: echo "calculuser.vercel.app" > dist/CNAME

      - name: Package Web distribution zip
        run: |
          cd dist
          zip -r ../calculuser-web.zip .
          cd ..

      - name: Upload Web artifacts directory
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-web
          path: dist/
          retention-days: 14

      - name: Upload Web artifacts zip
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-web-zip
          path: calculuser-web.zip
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: webapge
          cname: calculuser.vercel.app

  build-windows:
    name: Build Windows Executables & Installers
    needs: verify-and-web
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundles and binaries
        run: bun run tauri:build

      - name: Collect and organize Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path win-dist | Out-Null

          # 1. Standalone portable executable and zip
          $rawExe = "src-tauri/target/release/calculuser.exe"
          if (Test-Path $rawExe) {
            Copy-Item $rawExe -Destination "win-dist/calculuser-portable-x64.exe"
            Compress-Archive -Path "win-dist/calculuser-portable-x64.exe" -DestinationPath "win-dist/calculuser-portable-x64.zip" -Force
          }

          # 2. NSIS setup installer
          $nsisExes = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $nsisExes) {
            Copy-Item $f.FullName -Destination "win-dist/calculuser-setup-x64.exe"
          }

          # 3. WiX MSI installer
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($f in $msiFiles) {
            Copy-Item $f.FullName -Destination "win-dist/calculuser-installer-x64.msi"
          }

          Get-ChildItem -Path win-dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculuser-windows
          path: win-dist/
          retention-days: 14

      - name: Download web zip artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: calculuser-web-zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win-dist/*
            calculuser-web.zip
          draft: false
          prerelease: false
