al Type）。"},{mode:"build",id:"reverse-apply",chapter:1,code:"1.7",title:"反喂器",guestLine:"依次放入 A 和 B，出来的结果是「B 吃下 A」。",hintOnFail:"开两个槽分别接住 A 和 B，再用「◀ 喂入」让第二个信号珠吃下第一个。",forbidden:["I","K","S"],allowBlueprint:!0,atoms:["A","B"],parSize:5,tests:[{args:[m("A"),m("B")],expect:E("B A")},{args:[m("B"),m("A")],expect:E("A B")}],unlocksToolId:"T",note:"信号珠的顺序决定了谁先被喂给谁，这就是反序应用（Thrush）。"},{mode:"build",id:"self-apply",chapter:1,code:"1.8",title:"自吞环",guestLine:"收到一个东西，让它「自己吃下自己」。",hintOnFail:"只开一个槽，里面的「◀ 喂入」左右两侧都放同一个颜色的信号珠。",forbidden:["I","K","S"],allowBlueprint:!0,atoms:["A","B"],parSize:4,tests:[{args:[m("A")],expect:E("A A")},{args:[m("B")],expect:E("B B")}],unlocksToolId:"omega",note:"同一个信号珠可以使用两次！注意：如果把它喂给它自己，机器就会永不停止地转下去。"},{mode:"build",id:"split-s",chapter:1,code:"1.9",title:"认识分叉器",guestLine:"货架新到了菱形「分叉器」：它能把输入同时发给两路。不用开槽，试着用它复刻「自己吃自己」！",hintOnFail:"分叉器需要喂入两件东西。把两路都接上直通管，输入就会同时送到两路并相吃。",forbidden:["K"],allowBlueprint:!1,atoms:["A","B"],parSize:5,tests:[{args:[m("A")],expect:E("A A")},{args:[m("B")],expect:E("B B")}],unlocksToolId:"omega*",note:"菱形 S 把“复制再分发”封装成了一件零件：S I I 和刚才开槽造的自吞环效果完全相同。"},{mode:"build",id:"skk-identity",chapter:1,code:"1.10",title:"缺货应急",guestLine:"直通管卖光了！现成 I 已禁用，只用「分叉器」和「截留闸」，再造一台传话筒出来。",hintOnFail:"让分叉器把输入分给两个截留闸，K 吃下输入的同时会把另一路吞掉。",forbidden:["I"],allowBlueprint:!1,atoms:["A","B"],parSize:5,tests:[{args:[m("A")],expect:m("A")},{args:[m("B")],expect:m("B")}],unlocksToolId:"I'",note:"精妙！只要有 S 和 K，就能搭出工坊里的任何基础零件。"},{mode:"run",id:"run-drop-omega",chapter:2,code:"2.1",title:"丢掉怪物（跑）",guestLine:"桌上这台机器右侧挂着一个死循环怪物！点击发光的连接点让机器运转，在 1 步内安全停机。",hintOnFail:"如果先点右边的死循环会越转越大；直接点最外层的截留闸「K」，一口把它丢掉！",initialTerm:E("@K A ((@S @I @I) (@S @I @I))"),targetTerm:m("A"),stepBudget:1,note:"顺序决定能不能停下来：先处理外层的丢弃（正则序），就能直接跳过死循环。"},{mode:"typebuild",id:"tb-thrush",chapter:2,code:"2.2",title:"型流导引：反序",guestLine:"构造契合「A -> (A -> B) -> B」型流印章的装置，让后入的变换器接收先前传入的数据。",hintOnFail:"开两层槽 λx. λf.，内层用应用节点搭建 f x。",targetTy:be("A -> (A -> B) -> B"),parSize:5,note:"反序应用在类型系统中的镜像：数据与接收该数据的函数严格契合。"},{mode:"run",id:"run-inner-first",chapter:2,code:"2.3",title:"先化再复制（跑）",guestLine:"桌上有一台分叉复制机正准备吃下「直通管 ◀ A」。在 4 步之内化到底！",hintOnFail:"如果先让外层分叉，里层的「I ◀ A」会被复制成两份、多花一步！先点里层让它变成 A。",initialTerm:E("(@S @I @I) (@I A)"),targetTerm:E("A A"),stepBudget:4,note:"直觉反转：要被复制的东西，先化简再复制才省步数！"},{mode:"typebuild",id:"tb-compose",chapter:2,code:"2.4",title:"型流导引：复合",guestLine:"搭建类型为「(B -> C) -> (A -> B) -> A -> C」的管道网络，实现纯蓝图层面的管道串接。",hintOnFail:"开三层槽接收 f、g、x，内层搭建应用 f (g x)。",targetTy:be("(B -> C) -> (A -> B) -> A -> C"),parSize:7,note:"这就是 B 组合子的类型签名，函数复合在类型论中的严谨形式。"},{mode:"run",id:"run-boss-hybrid",chapter:2,code:"2.5",title:"混合博弈（跑）",guestLine:"这台大机器里既有要丢掉的累赘，又有要复制的参数。必须在 5 步之内化简到「A ◀ A」！",hintOnFail:"先点最外层的 K 丢掉右侧长链，再先化简里层的「I ◀ A」，最后再触发 S！",initialTerm:E("@K ((@S @I @I) (@I A)) (@I (@I (@I B)))"),targetTerm:E("A A"),stepBudget:5,note:"通吃 Boss！真正的求值高手懂得在「丢弃时先外后内、复制时先内后外」之间切换。"},{mode:"build",id:"compose-b",chapter:2,code:"2.6",title:"串联桥（复合）",guestLine:"依次放入 A、B、C，交出「A 吃下（B 吃下 C）」。",hintOnFail:"开三个槽，分别接住 A、B、C，从内向外用「◀ 喂入」串起来。",forbidden:[],allowBlueprint:!0,atoms:["A","B","C"],parSize:9,tests:[{args:[m("A"),m("B"),m("C")],expect:E("A (B C)")},{args:[m("B"),m("A"),m("C")],expect:E("B (A C)")}],unlocksToolId:"B",note:"函数复合（B 组合子）：把两台机器首尾相接，让数据先经过 B 再经过 A。"},{mode:"typebuild",id:"tb-flip",chapter:2,code:"2.7",title:"型流导引：倒置",guestLine:"构造契合「(A -> B -> C) -> B -> A -> C」型流印章的换序中转站。",hintOnFail:"开三层槽接收 f、x、y，内层用应用节点构造 (f y) x。",targetTy:be("(A -> B -> C) -> B -> A -> C"),parSize:7,note:"C 组合子的类型体现了多参数柯里化函数的参数位置对调能力。"},{mode:"build",id:"flip-c",chapter:2,code:"2.8",title:"换序器",guestLine:"依次放入 F、A、B，交出「（F 吃下 B）再吃下 A」。",hintOnFail:"开三个槽，让第一个信号珠 F 先吃下第三个槽的 B，再吃下第二个槽的 A。",forbidden:[],allowBlueprint:!0,atoms:["A","B","F"],parSize:8,tests:[{args:[m("F"),m("A"),m("B")],expect:E("F B A")},{args:[m("F"),m("B"),m("A")],expect:E("F A B")}],unlocksToolId:"C",note:"换序组合子（C）：用来交换后续接收参数的顺序。"},{mode:"build",id:"church-two",chapter:2,code:"2.9",title:"用两次（数字 2）",guestLine:"连续放入 F 和 X，交出「F 吃下（F 吃下 X）」。",hintOnFail:"开两个槽，先让 F 吃下 X，再在外面包一层让 F 吃下前面整体。",forbidden:[],allowBlueprint:!0,atoms:["F","X"],parSize:7,tests:[{args:[m("F"),m("X")],expect:E("F (F X)")},{args:[m("A"),m("B")],expect:E("A (A B)")}],unlocksToolId:"W",note:"这就是邱奇数字「2」：把一个动作连续执行两次。执行 0 次就是数字 0（和弃前闸同形）。"},{mode:"build",id:"succ",chapter:2,code:"2.10",title:"后继器（+1）",guestLine:"输入一个邱奇数字 N，再给 F 和 X，交出比 N 多吃一次 F 的结果！",hintOnFail:"开三个槽接收 N、F、X，先让 (N ◀ F ◀ X) 跑出旧结果，最外面再让 F 吃一次。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:9,tests:[{args:[E("λf.λx. x"),m("A"),m("B")],expect:E("A B")},{args:[E("λf.λx. f x"),m("A"),m("B")],expect:E("A (A B)")}],unlocksToolId:"succ",note:"succ N f x = f (N f x)：数字就是动作的应用次数，后继器就是在最外层再套一次应用！"},{mode:"build",id:"not",chapter:3,code:"3.1",title:"逻辑非（反相）",guestLine:"输入布尔值 B（真为截留闸，假为弃前闸），交出它的反面：真变假，假变真！",hintOnFail:"布尔值本身就是选择器！把 (假 ◀ 真) 喂给 B，真就会选第一个（假），假就会选第二个（真）。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:6,tests:[{args:[E("λx.λy. x"),m("A"),m("B")],expect:m("B")},{args:[E("λx.λy. y"),m("A"),m("B")],expect:m("A")}],unlocksToolId:"not",note:"布尔值的本质就是「选哪一路」：not = λb. b 假 真。"},{mode:"typebuild",id:"tb-bool-sel",chapter:3,code:"3.2",title:"型流导引：二选一",guestLine:"构造契合「A -> A -> A」纯同构二元选择签名的装置（选取第一路）。",hintOnFail:"开双槽接收 x 与 y，内部交付第一个参数 x。",targetTy:be("A -> A -> A"),parSize:3,note:"在单类型系统中，邱奇真值与假值均契合 A -> A -> A 的二选一类型契约。"},{mode:"build",id:"and",chapter:3,code:"3.3",title:"逻辑与（串连）",guestLine:"输入 P 和 Q 两个布尔值：只有两者都为真时才交出真，否则交出假！",hintOnFail:"开两个槽接收 P 和 Q。如果 P 为真，结果取决于 Q；如果 P 为假，直接交出假（或 P 本身）。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:6,tests:[{args:[E("λx.λy. x"),E("λx.λy. x"),m("A"),m("B")],expect:m("A")},{args:[E("λx.λy. x"),E("λx.λy. y"),m("A"),m("B")],expect:m("B")},{args:[E("λx.λy. y"),E("λx.λy. x"),m("A"),m("B")],expect:m("B")}],unlocksToolId:"and",note:"and = λp.λq. p q p：短短几个零件就构成了计算机最核心的与逻辑。"},{mode:"build",id:"or",chapter:3,code:"3.4",title:"逻辑或（并联）",guestLine:"输入 P 和 Q：只要其中一个为真就交出真，两者都为假才交出假！",hintOnFail:"如果 P 为真直接交出真（即 P）；如果 P 为假，结果取决于 Q。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:6,tests:[{args:[E("λx.λy. x"),E("λx.λy. y"),m("A"),m("B")],expect:m("A")},{args:[E("λx.λy. y"),E("λx.λy. x"),m("A"),m("B")],expect:m("A")},{args:[E("λx.λy. y"),E("λx.λy. y"),m("A"),m("B")],expect:m("B")}],unlocksToolId:"or",note:"or = λp.λq. p p q：与门的对称镜像。"},{mode:"build",id:"pair",chapter:3,code:"3.5",title:"打包盒（Pair）",guestLine:"把 A 和 B 打包封存，等待挑选器 F 传入时交出「F A B」。",hintOnFail:"开三个槽，让第三个槽的 F 先吃下 A，再吃下 B。",forbidden:[],allowBlueprint:!0,atoms:["A","B","F"],parSize:8,tests:[{args:[m("A"),m("B"),m("F")],expect:E("F A B")},{args:[m("B"),m("A"),m("F")],expect:E("F B A")}],unlocksToolId:"pair",note:"邱奇序对：pair = λa.λb.λf. f a b。数据结构不是实体，而是一个随时准备接受调遣的函数闭包！"},{mode:"typebuild",id:"tb-pair",chapter:3,code:"3.6",title:"型流导引：封包",guestLine:"构造契合「A -> B -> (A -> B -> C) -> C」序对封装型流印章的蓝图闭包。",hintOnFail:"开三层槽接收 a、b、f，内层构造应用 (f a) b。",targetTy:be("A -> B -> (A -> B -> C) -> C"),parSize:7,note:"高阶延续传递编码的典型类型：将数据封装至延续接收者之中。"},{mode:"build",id:"fst",chapter:3,code:"3.7",title:"拆第一件（Fst）",guestLine:"输入一个打包好的序对 P，取出它里面的第一件物品！",hintOnFail:"序对需要喂一个挑选器：截留闸（真）选第一件，弃前闸（假）选第二件！把截留闸喂给 P。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:4,tests:[{args:[E("(λa.λb.λf. f a b) A B")],expect:E("A")},{args:[E("(λa.λb.λf. f a b) B A")],expect:E("B")}],unlocksToolId:"fst",note:"fst = λp. p (λx.λy. x)：消费者就是把规则作为参数喂给数据结构本身。"},{mode:"typebuild",id:"tb-fst",chapter:3,code:"3.8",title:"型流导引：解首件",guestLine:"构造满足「((A -> B -> A) -> A) -> A」契约的解构装置，将常数选择器注入待解构实体。",hintOnFail:"开单槽接收 p，内部用应用节点连接 p 与第一路选择器 (λx. λy. x)。",targetTy:be("((A -> B -> A) -> A) -> A"),parSize:6,note:"通过传入类型为 A -> B -> A 的选择核，令序对内部的闭包产出首部值。"},{mode:"build",id:"snd",chapter:3,code:"3.9",title:"拆第二件（Snd）",guestLine:"输入一个打包好的序对 P，取出它里面的第二件物品！",hintOnFail:"把弃前闸（假，即 λx.λy. y）喂给序对 P。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:4,tests:[{args:[E("(λa.λb.λf. f a b) A B")],expect:E("B")},{args:[E("(λa.λb.λf. f a b) B A")],expect:E("A")}],unlocksToolId:"snd",note:"snd = λp. p (λx.λy. y)：序对的完整提取方案闭环完成。"},{mode:"build",id:"from-maybe",chapter:3,code:"3.10",title:"缺省拆包（FromMaybe）",guestLine:"输入保底值 D 和一个可能为空的盒子 M：若盒子有值 X 则交出 X，若为空则交出保底值 D！",hintOnFail:"在 Maybe 编码中，空盒子就是 λd.λj. d（选第一路），有值就是 λd.λj. j X（把 X 喂给第二路）。把保底值 D 和直通管 I 喂给 M！",forbidden:[],allowBlueprint:!0,atoms:["D","X"],parSize:5,tests:[{args:[m("D"),E("λd.λj. d")],expect:m("D")},{args:[m("D"),E("(λx.λd.λj. j x) X")],expect:m("X")}],unlocksToolId:"fromMaybe",note:"fromMaybe = λd.λm. m d I：没有 null 指针异常，用高阶参数天然消灭空指针崩溃！"},{mode:"typebuild",id:"tb-zero",chapter:4,code:"4.1",title:"型流导引：零度",guestLine:"构造契合邱奇数系统「(A -> A) -> A -> A」基底签名的零值原形。",hintOnFail:"开两层槽 λf. λx.，直接交付基底参数 x。",targetTy:be("(A -> A) -> A -> A"),parSize:3,note:"在类型论中，邱奇数字统一具有 (A -> A) -> A -> A 形状（迭代器类型）。"},{mode:"typebuild",id:"tb-one",chapter:4,code:"4.2",title:"型流导引：一度",guestLine:"构造契合邱奇数系统「(A -> A) -> A -> A」签名的一次迭代项。",hintOnFail:"开两层槽 λf. λx.，内层应用 f x。",targetTy:be("(A -> A) -> A -> A"),parSize:5,note:"执行 1 次变换，是数字系统跨入递增序列的第一步。"},{mode:"typebuild",id:"tb-two",chapter:4,code:"4.3",title:"型流导引：二度",guestLine:"构造契合邱奇数系统「(A -> A) -> A -> A」签名的二次迭代项。",hintOnFail:"开两层槽 λf. λx.，内层嵌套应用 f (f x)。",targetTy:be("(A -> A) -> A -> A"),parSize:7,note:"二次迭代在简单类型系统中无需任何多态扩展即可完美验证。"},{mode:"build",id:"add",chapter:4,code:"4.4",title:"邱奇加法",guestLine:"输入两个数字 M 和 N，交出它们的和 M + N！",hintOnFail:"数字就是应用次数！先用 N 对 X 执行 N 次 F，再在这个结果上用 M 执行 M 次 F。",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:11,tests:[{args:[E("λf.λx. f x"),E("λf.λx. f (f x)"),m("A"),m("B")],expect:E("A (A (A B))")},{args:[E("λf.λx. x"),E("λf.λx. f x"),m("A"),m("B")],expect:E("A B")}],unlocksToolId:"add",note:"add = λm.λn.λf.λx. m f (n f x)：把两个计数管道无缝首尾相接。"},{mode:"build",id:"mul",chapter:4,code:"4.5",title:"邱奇乘法",guestLine:"输入两个数字 M 和 N，交出它们的乘积 M × N！",hintOnFail:"乘法就是复合：M (N f)。先让 N 把 f 包装成「重复 N 次」，再让 M 把这个复合动作重复 M 次！",forbidden:[],allowBlueprint:!0,atoms:["A","B"],parSize:8,tests:[{args:[E("λf.λx. f (f x)"),E("λf.λx. f (f (f x))"),m("A"),m("B")],expect:E("A (A (
